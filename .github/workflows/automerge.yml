name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    name: Auto-merge

    runs-on: ubuntu-latest

    # Check the PR author as well as the actor: someone else pushing to a
    # Dependabot branch makes them the actor, and their commits shouldn't be
    # auto-approved.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }} # zizmor: ignore[bot-conditions]
    steps:
      - name: Approve the PR
        run: gh pr review --approve "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --squash --auto "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
