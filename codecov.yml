# Don't add a comment to GitHub conversation if there is no coverage change.
comment:
  require_changes: true

# Coverage arrives as two uploads per commit, from two CI jobs: `go test` for the
# Go code and Vitest for the TypeScript in web/typescript. Both jobs run on every
# commit, so neither flag needs carryforward.
flags:
  go:
    paths:
      - "!web/typescript/"
  typescript:
    paths:
      - "web/typescript/"

# Require 100% diff coverage, only complain about project coverage.
coverage:
  status:
    project:
      default:
        informational: true
        target: 100%
      go:
        informational: true
        target: 100%
        flags:
          - go
      typescript:
        informational: true
        target: 100%
        flags:
          - typescript
    patch:
      default:
        informational: false
        target: 100%

ignore:
  # These are glorified shell scripts in the form of Go programs (for cross-platform use),
  # and they are separate from the server program.
  - "bin"
  # This is generated code from templ.
  - "web/template/*.go"
  # These are generated code from sqlc.
  - "store/imsdb/*.go"
  - "directory/clubhousedb/*.go"
