[package]
name = "ims"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Rust port of the Ranger IMS server (experimental)"

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.14"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
http-body = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "service"] }
http-body-util = "0.1"
jsonwebtoken = "9"
mime = "0.3"
multer = "3"
regex = "1"
include_dir = "0.7"
infer = "0.19"
rand = "0.9"
rpassword = "7"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "macros", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
scraper = "0.23"
ego-tree = "0.10"
testcontainers = "0.25"
tempfile = "3"
